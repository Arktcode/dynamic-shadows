apply plugin: "java"

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

compileJava {
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

ext {
    mindustryVersion = 'v159.7'
    mArtifact = project.hasProperty("modArtifact") ? modArtifact : project.name
    
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories {
    mavenCentral()
    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'
        }
        metadataSources { artifact() }
        content {
            includeVersion("Anuken", "Mindustry", mindustryVersion)
        }
    }
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

// 1. Tarea principal: Crea el mod para PC
jar {
    archiveFileName = "${mArtifact}.jar"
    
    // Incluir manifiesto, código e icono
    from(projectDir) {
        include "mod.hjson"
        include "icon.png"
        include "bundles/**"
    }
    from(sourceSets.main.output)
    
    // Incluir assets
    if(new File(projectDir, "assets").exists()){
        from("assets/"){
            into("")
        }
    }
    
    // Incluir dependencias si las hubiera
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// 2. Tarea Android: Genera el DEX y lo mete dentro del JAR anterior
tasks.register('deploy') {
    dependsOn "jar"

    doLast {
        def d8Path = ""
        def d8Jar = new File(projectDir, "d8.jar")
        def finalJar = new File(projectDir, "build/libs/${mArtifact}.jar")
        def dexFile = new File(projectDir, "build/libs/classes.dex")

        def androidJar = null
        // Buscar d8
        if (sdkRoot && new File(sdkRoot).exists()) {
            def platformRoot = new File("$sdkRoot/platforms/").listFiles()?.findAll { f ->
                def jar = new File(f, "android.jar")
                return jar.isFile() && jar.length() > 0 && !f.name.contains("beta") && !f.name.contains("preview")
            }?.sort()?.reverse()?.find { true }
            if (platformRoot) {
                androidJar = new File(platformRoot, "android.jar")
                def d8 = isWindows ? "d8.bat" : "d8"
                def buildTools = new File("$sdkRoot/build-tools/").listFiles()?.sort()?.reverse()?.find { f -> new File(f, d8).exists() }
                if (buildTools) d8Path = new File(buildTools, d8).absolutePath
                else d8Path = d8
            }
        }

        if (d8Path == "") {
            if (!d8Jar.exists()) {
                println "Descargando d8.jar portátil..."
                new URL("https://github.com/Anuken/Mindustry/releases/download/v146/d8.jar").withInputStream { i -> d8Jar.withOutputStream { it << i } }
            }
            d8Path = "java -cp d8.jar com.android.tools.r8.D8"
        }

        println "Generando DEX para Android..."
        
        // Ejecutar d8 (salida a una carpeta temporal para sacar el classes.dex)
        def tempDir = new File(projectDir, "build/libs/dex-temp")
        delete tempDir
        tempDir.mkdirs()

        // Empacar clases limpias en un jar temporal para D8 sin problemas de comillas en Linux
        def rawClassesJar = new File(tempDir, "classes-raw.jar")
        def packProc = ['jar', 'cf', rawClassesJar.absolutePath, '-C', sourceSets.main.output.classesDirs.singleFile.absolutePath, '.'].execute(null, projectDir)
        packProc.waitForProcessOutput(System.out, System.err)

        def d8Args = []
        if (d8Path.startsWith("java ")) {
            d8Args.addAll(d8Path.split(" "))
        } else {
            d8Args.add(d8Path)
        }
        d8Args.add("--min-api")
        d8Args.add("14")
        if (androidJar != null && androidJar.exists()) {
            d8Args.add("--lib")
            d8Args.add(androidJar.absolutePath)
        }
        d8Args.add("--output")
        d8Args.add(tempDir.absolutePath)
        d8Args.add(rawClassesJar.absolutePath)

        def process = d8Args.execute(null, projectDir)
        process.waitForProcessOutput(System.out, System.err)
        
        if (process.exitValue() == 0) {
            println "Inyectando DEX en el JAR final..."
            def jarProc = ['jar', 'uf', finalJar.absolutePath, '-C', tempDir.absolutePath, 'classes.dex'].execute(null, projectDir)
            jarProc.waitForProcessOutput(System.out, System.err)
            
            delete tempDir
            println "¡ÉXITO TOTAL! Mod multiplataforma listo en: build/libs/${mArtifact}.jar"
        } else {
            throw new GradleException("Fallo al generar el soporte de Android.")
        }
    }
}

tasks.register('dex') {
    dependsOn "deploy"
}

tasks.register('dexify') {
    dependsOn "deploy"
}
